name: crm-rise

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_rise
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_rise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage S3-compatível para mídias do WhatsApp (áudio, imagem, documento).
  minio:
    image: minio/minio:latest
    container_name: crm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crmminio
      MINIO_ROOT_PASSWORD: crmminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Cria o bucket de mídia na primeira subida e encerra.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 crmminio crmminio123 &&
      mc mb --ignore-existing local/crm-rise-media &&
      echo 'bucket pronto'
      "

  # Gateway WhatsApp. A sessão é pareada via QR Code em http://localhost:3001
  waha:
    image: devlikeapro/waha:latest
    container_name: crm-waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_PRINT_QR: "false"
      # Chave exigida no header X-Api-Key das chamadas à WAHA.
      WAHA_API_KEY: ${WAHA_API_KEY:-troque-esta-chave}
      # Painel web em http://localhost:3001/dashboard.
      # Sem estas variáveis o WAHA não sobe credencial padrão utilizável —
      # é preciso definir usuário e senha explicitamente.
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-rise-dashboard-2026}
      WHATSAPP_HOOK_URL: http://host.docker.internal:3333/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message,message.ack,session.status
      WAHA_LOG_LEVEL: info
    ports:
      - "3001:3000"
    volumes:
      - waha_sessions:/app/.sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  waha_sessions:
